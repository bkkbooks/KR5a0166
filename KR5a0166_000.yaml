front:
  text: 靈寶自然九天生神三寶大有金書騰二天寶君者則大洞之尊神天寶丈人則天寶君之祖氣也丈人是混洞大無元髙上玉皇之氣九萬九千九百九十億萬氣後至龍漠元年化生天寶君出書時號髙上大有玉清宫靈寶君者則洞玄之尊神靈寶丈人財靈寶君之祖氣也丈人是赤混太無元上玉虛之氣九萬九千九百九十九萬氣後至龍漢開圖化生靈寶君經一劫至赤明元年出書度人時號上清玄都二京七寶紫微宫神寶君者則洞神之尊神神寶丈人則神寶君之祖氣也丈人是冥寂玄通元上玉虛之氣九萬九千九百九十萬氣後至赤明元年化生神寶君經二劫至上皇元年出書時號三皇洞神太清太極宫此三號雖年殊號異本同一也分為玄元始三氣而治三寶皆三氣之尊神號生三氣三號合生九氣九氣出乎太空之先隱乎空洞之中無光無象無形無名無色無緒無音無聲道運御世開闢玄通三色混沌乍存乍亡運推數極三氣開光氣清髙澄積陽成天氣結凝滓積滯成地九氣列正日月星宿隂陽五行人民品物並受生成天地萬化自非三元所育九氣所導莫能生也三氣為天地之尊九氣為萬物之根故三合成德天地之極也人之受生於胞胎之中三元育養九氣結形故九月神布氣滿能聲聲尚神具九天稱慶太一執符帝君品命主録勒籍司命定算五帝監生聖毋衛房天神地祇三界備守九天司馬在庭東向讀九天生神寶章九過男則萬神唱恭女則萬神唱奉男則司命敬諾女則司命敬順於是而生九天司馬不下命章萬神不唱恭諾終不生也夫人得還生於人道濯形太陽驚天駭地貴亦難勝天真地神三界齊臨亦不輕也當生之時亦不為陋也所以能愛其形保其神貴其氣固其根終不死壞而得神仙骨肉同飛上登三清是與三氣合德九氣齊并也但人得生而自不能尊其氣貴其形寶其命愛其神自取死壞離其本真耳九天生神章乃三洞飛玄之氣三合成音結成靈文混合百神隱韻內名生氣結形自然之章天寶誦之以開天地之光靈寶誦之以開九幽長夜之魂神寶誦之以制萬靈太一誦之以具身神帝君誦之以結形九天誦之以生人學士誦之以升天鬼靈聞之以升遷凡夫聞之以長存幽魂聞之以開度枯朽聞之以發煙嬰孩聞之以能言死骸聞之以還人三寶神奧萬品生根故非鬼神所知凡夫所聞也夫學上道希慕神仙及得尸解滅度轉輪終歸仙道形與神同不相逺離俱入道真而無此文則胞胎結滯死氣固根真景不守生氣無津九戶閡塞體不生神徒受一形若寄氣而行學得此法可坐致自然三寶尊重九天至真祕之大有九重金格紫陽玉臺自非天地一開其文不出元始禁書非鬼神所聞竊之者風刀萬劫魂死無生依科遵奉形神同仙三元宫中宿有金名紫字刻書來生應為三清神仙之人當得此文有其緣會當齎金寶奉師效心依科盟受閉心奉行愼勿輕泄風刀考身修行之法千日長齎不關人事諸塵漏盡夷心默念清香執戒入室東向扣齒九通調聲正氣誦詠寶章誦之一過聲聞九天誦之二過天地設恭誦之三過三界禮房誦之四過天王降仙誦之五過五帝朝真誦之六過魔王束身誦之七過星宿停關誦之八過幽夜光明誦之九過諸天下臨一切神靈莫不衛軒一過徹天胞原宣通二過響地胎結解根三過神禮魂門練仙四過天王降仙魄户閉關五過五帝朝真藏府清涼六過魔王伏諾胃管生津七過星宿朗明孔竅開聰八過幽夜顯光三部八景整具形神九過諸天下臨三關五藏六府九宫金樓玉室十二重門紫戶玉閣三萬六千關節根源本始一時生神九過為一遍一遍周竟三界舉名五帝友别稱為真人十遍通氣制御萬靈魔王保舉列上諸天百遍通神坐致自然太一度符元君受生千遍通靈坐在立亡仙童玉女役使東西萬遍道備馳騁龍駕白日登晨元始天尊時靜處間居偃息雲宫黃房之內七寶幃中熙夷養素空碧練真耽咀洞慧俯研生神理微太混嘯朗九天是時飛天大聖無極神王玉輔上宰四協侍晨清齋建節侍在側焉憑瓊顔而妙感仰靈眸而開矜竊神章而踴躍餐天音而蒙生敢乘機而悟會冒靈盻而披心於是飛天大聖無極神王前進作禮稽首而言上白天尊賤臣幸會得仰侍靈軒不以短狹叨濯冥津重悟凝玄位登神王總御生死領括天仙賞監七覺逺覽遐方雍觀上宰對司侍晨方當乘機應會履九太陽洞理隂符撫掌兆民大運將期數終甲申洪流蕩穢凶災彌天三官鼓筆料别種人考算功過善惡當分自赤明以來至上皇元年依元陽玉匱受度者應二十四萬人開皇以後數至甲申諸天選序仙曹空廢官僚不充遊散職司皆應選人依元陽玉曆當於三代更料有心積善建功為三界所舉五帝所保名在上天者取十萬人以充其任又當别舉一十二萬人以充儲官如此之例或以宿名玄圖或以骨像合仙或以滅度因緣轉輪或以篤好三寶善功徹天或供養師寶為三官所稱或修齋奉戒功德積感或施散財寶建立道堂或救恤窮乏濟度天人或為三師建功充足天官有名考算簿録三官相應皆逆注種名上下有别毫分無遺又九幽之府被東華青宫九龍符命使拔九幽玉匱男女死魂宿名有善功德滿足應受開度者取三十二萬人以充甲申驅除之後開大有之民當此之時生死交會善惡分判得過者真為樂哉然三官相切文墨紛紜龍門受會鳥毋督仙萬聖顯駕晝夜無間功過平等使生死無偏此之昏閙亦臣之憂矣大期既切觸事闕替恆恐一𣅂受罹公門伏聞天尊造大慈之化垂憐蒼生開九天之奧以濟兆民明科有禁戒非賤臣所可參聞然大數有期甲申垂終運度促急大法冝行使有心者得於考算之中間於法音開示於視聽勸化於未悟者也緣兹上陳懼觸天顔願見哀憨賜所未聞於是天尊撫几髙抗凝神遐想仰誦洞章嘯詠琳琅良久忽然嘆曰上範虛漠理微太幽道逹重玄氣冠神霄至極難言妙亦難超子既司帝位受任神王飛天翼於瓊闕四宰輔於明輪遐盻極覽領綜無窮雍和萬化撫料蒼生今大運啓期三五告辰百六應機陽九激揚洪泉鼓波萬災厲天四宫選舉以充種民三代昏亂善惡冝分子當勞心兆庶疲於三官興廢之際事須開能今以相委其勉之焉寶書妙重九天靈音施於上聖非鬼神所聞明真有格四萬劫一行今冒禁相付子祕之矣愼勿輕傳登命九天司馬侍仙玉郎開紫陽玉笈雲錦之囊出九天生神玉章四輔列位五老監真太一命屐玉帝唱盟一依俯仰明真具典南向長跪以付飛天無極神王法事既畢諸天復位天尊重告飛天神王此九天之章乃三洞飛玄之氣三會成音結成真文混合百神隱韻內名故太一試觀攝生十方領會洞虛啓誓丹青自無億劫因緣宿名帝圖不得參見得眄篇目九祖同仙當採擇其人應為仙者七百年中清齋千日齎金繒誓心依盟以傳愼之則享祚漏之則禍臻享祚則福延九祖德重山海招禍則考流億劫痛於毒湯風刀相刑可不愼之焉
