body:
  text: 始青清微天寶章元始洞空無三氣精上門紫容觀太空四明植靈根妙化發東瓊三翩起西崑號應九玄清五華帶錦雲離羅煥神燈七精耀北玄飄飄上清畿奕奕帝一尊落落髙上章羽童何紛紛流香本無色洞入萬仙羣左回三流劫右轉九天關金華纓玉童八風舞空輪四時無停機青白早明分九九改劫運三三度一春天地有終會袐激歸在翻洞明正一法嚴修六天文太平返空無奉翊後聖君元白禹餘靈寶章靈風起西門錦雲生東瓊三氣煥玉洲流香乘東輕玉華披風散倐忽朗九清騫林耀朱日黃水逐月生中有採芝童衣羽戴飛青飊景萬領風逍遙宴緣軿總御九空輪運開萬稽程左命三天文右攝六天兵檢氣返空洞六度應運傾劫運自有會誰測敗與成弘波輪靈罡六合無遺刑白尸漂長流孤魂因復靈悲此去來際乃覺正法明至學加精修東華結瓊名欣有白簡人相與樂太平玄黃太赤神寶章洞關運天綱五氣輪三微紫户吐瓊簡金門納神暉八會交真風晃朗重名開天際九清外落落髙神回三色返空無四候應玉畿河侯巳鼓筆五行潛相推六度無終劫運極乘氣歸萬魔羅天布羣凶竟吐威兆民負災衝積尸令人悲妙哉正法文理劫明不衰至時拳相迎契在九天飛與爾期太平放心無翮飛靈寶自然九天生神三寶大有金書
